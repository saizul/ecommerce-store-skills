<html><head><title>Checkout</title>
<script src="https://www.google.com/recaptcha/api.js"></script>
<script src="https://embed.tawk.to/abc/default"></script>
<script src="https://widget.privy.com/assets/widget.js"></script>
<script src="https://static.hotjar.com/c/hotjar-1.js"></script>
</head><body>
<form id="checkout">
  <input type="text" name="first_name" placeholder="First name">
  <input type="text" name="last_name" placeholder="Last name">
  <input type="text" name="company" placeholder="Company">
  <input type="text" name="email" placeholder="Email" autocomplete="off">
  <input type="text" name="email_confirm" placeholder="Confirm email">
  <input type="number" name="phone" placeholder="Phone">
  <input type="text" name="phone2" placeholder="Alternative phone">
  <input type="text" name="address_1" placeholder="Address">
  <input type="text" name="address_2" placeholder="Apartment">
  <input type="text" name="city" placeholder="City">
  <input type="text" name="state" placeholder="District">
  <input type="text" name="postcode" placeholder="Postcode">
  <select name="country"><option>Bangladesh</option></select>
  <input type="text" name="coupon_code" placeholder="Coupon">
  <input type="password" name="password" placeholder="Password">
  <input type="password" name="password2" placeholder="Repeat password">
  <textarea name="order_notes" placeholder="Notes"></textarea>
  <div class="g-recaptcha" data-sitekey="x"></div>
  <button>Pay now</button>
</form>
</body></html>

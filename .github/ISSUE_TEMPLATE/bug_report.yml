name: Bug report
description: A script crashed, reported a wrong finding, or a skill gave unsafe or wrong advice
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real customer data** (names, phone numbers, emails, addresses) or API keys.
        Reproduce the problem with a small synthetic file instead.
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - product-feed-validator
        - product-schema
        - checkout-cro-audit
        - product-content-writer
        - order-export-cleanup
        - inventory-reorder
        - store-speed-audit
        - returns-and-fraud-signals
        - validator / repository tooling
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command you ran, its output, and (for wrong findings) a minimal synthetic input.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS 15, Python 3.12, WooCommerce 9.x / Shopify, Claude Code / Codex CLI"
    validations:
      required: true
